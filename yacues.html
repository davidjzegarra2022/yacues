<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Envíos - Perú | Efecto Dinámico</title>
    <style>
        :root {
            --primary-color: #D91023; /* Rojo Perú */
            --bg-dark: #0f172a;       /* Azul oscuro profundo */
            --line-color: rgba(255, 255, 255, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.92);
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: var(--bg-dark);
            overflow-x: hidden;
            position: relative;
        }

        /* --- FONDO CREATIVO DE LÍNEAS PARALELAS --- */
        .lines-background {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 0;
            /* Gradiente repetitivo para crear líneas diagonales */
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 40px,
                var(--line-color) 40px,
                var(--line-color) 41px
            );
            /* Animación de movimiento continuo */
            animation: flowLines 60s linear infinite;
            pointer-events: none; /* Permite hacer clic a través del fondo */
        }

        /* Capa adicional para profundidad (líneas más finas en sentido contrario) */
        .lines-background::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 80px,
                rgba(217, 16, 35, 0.03) 80px, /* Toque rojo muy sutil */
                rgba(217, 16, 35, 0.03) 81px
            );
            animation: flowLinesReverse 90s linear infinite;
        }

        @keyframes flowLines {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        @keyframes flowLinesReverse {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, 50px); }
        }

        /* --- CONTENEDOR DEL FORMULARIO --- */
        .container {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(10px); /* Efecto vidrio esmerilado */
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        h1 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 5px;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.8);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(217, 16, 35, 0.1);
            background: #fff;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col { flex: 1; }

        /* Radio Buttons Personalizados */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.2s;
            background: rgba(255,255,255,0.5);
        }

        .radio-option:hover { background: #fff; border-color: #ccc; }
        
        .radio-option input[type="radio"] {
            width: auto; margin: 0; accent-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(217, 16, 35, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 16, 35, 0.4);
        }

        button:active { transform: translateY(0); }

        .note { font-size: 0.75rem; color: #777; margin-top: 4px; }

        /* Área de Resumen */
        #summaryContainer {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
            animation: fadeIn 0.5s ease;
        }

        textarea#finalSummary {
            width: 100%;
            height: 220px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            resize: vertical;
            margin-bottom: 10px;
            border-radius: 8px;
            color: #333;
        }

        .copy-btn {
            background-color: #1a1a1a;
            box-shadow: none;
        }
        .copy-btn:hover { background-color: #000; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .row { flex-direction: column; gap: 0; }
            .container { padding: 25px; }
            .radio-group { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- Fondo Animado -->
    <div class="lines-background"></div>

    <div class="container">
        <h1>Registro de mis datos</h1>
        <p class="subtitle">Complete los datos para coordinar su despacho, al finalizar confirma/consulta conmigo</p>
        
        <form id="shippingForm">
            <div class="form-group">
                <label for="dni">DNI del Remitente</label>
                <input type="text" id="dni" placeholder="Ej: 70507024" maxlength="8" pattern="[0-9]{8}" required>
                <div class="note">Solo números (8 dígitos)</div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="nombres">Nombres Completos</label>
                    <input type="text" id="nombres" required>
                </div>
                <div class="col form-group">
                    <label for="celular">Celular / WhatsApp</label>
                    <input type="tel" id="celular" placeholder="9XXXXXXXX" maxlength="9" required>
                </div>
            </div>

            <div class="form-group">
                <label for="departamento">Departamento de Recojo</label>
                <select id="departamento" required>
                    <option value="">Seleccione...</option>
                    <option value="Lima">Lima</option>
                    <option value="Callao">Callao</option>
                    <option value="Arequipa">Arequipa</option>
                    <option value="Trujillo">La Libertad (Trujillo)</option>
                    <option value="Piura">Piura</option>
                    <option value="Cusco">Cusco</option>
                    <option value="Otro">Otra Provincia</option>
                </select>
            </div>

            <div class="form-group">
                <label for="distrito">Distrito</label>
                <input type="text" id="distrito" placeholder="Ej: San Isidro, Los Olivos" required>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección Exacta</label>
                <textarea id="direccion" rows="2" placeholder="Av/Calle, Número, Referencia" required></textarea>
            </div>

            <div class="form-group">
                <label>¿Es usted el titular en la recepción?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="titular" value="SI" required> SÍ
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="titular" value="NO" required> NO
                    </label>
                </div>
            </div>

            <button type="submit">Generar Resumen de Pedido</button>
        </form>

        <div id="summaryContainer">
            <label for="finalSummary" style="margin-bottom:10px;">Resumen listo para copiar:</label>
            <textarea id="finalSummary" readonly></textarea>
            <button type="button" class="copy-btn" onclick="copyToClipboard()">Copiar Texto</button>
        </div>
    </div>

    <script>
        document.getElementById('shippingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const dni = document.getElementById('dni').value;
            if (!/^\d{8}$/.test(dni)) { alert('DNI inválido (debe tener 8 dígitos).'); return; }

            const celular = document.getElementById('celular').value;
            if (!/^9\d{8}$/.test(celular)) { alert('Celular inválido (debe empezar con 9 y tener 9 dígitos).'); return; }

            const nombres = document.getElementById('nombres').value.toUpperCase();
            const depto = document.getElementById('departamento').value;
            const distrito = document.getElementById('distrito').value.toUpperCase();
            const direccion = document.getElementById('direccion').value.toUpperCase();
            const titular = document.querySelector('input[name="titular"]:checked').value;
            const fecha = new Date().toLocaleDateString('es-PE');

            const summaryText = `*SOLICITUD DE ENVÍO - PERÚ*\n` +
                                `--------------------------------\n` +
                                `📅 FECHA: ${fecha}\n` +
                                `👤 REMITENTE: ${nombres}\n` +
                                ` DNI: ${dni}\n` +
                                `📱 CELULAR: ${celular}\n` +
                                `--------------------------------\n` +
                                `📍 UBICACIÓN DE RECOJO:\n` +
                                `   Depto: ${depto}\n` +
                                `   Distrito: ${distrito}\n` +
                                `   Dirección: ${direccion}\n` +
                                `--------------------------------\n` +
                                `✅ TITULAR EN RECEPCIÓN: ${titular}\n` +
                                `--------------------------------`;

            document.getElementById('finalSummary').value = summaryText;
            const container = document.getElementById('summaryContainer');
            container.style.display = 'block';
            container.scrollIntoView({ behavior: 'smooth' });
        });

        function copyToClipboard() {
            const copyText = document.getElementById("finalSummary");
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(copyText.value).then(() => {
                const btn = document.querySelector('.copy-btn');
                const original = btn.innerText;
                btn.innerText = "¡Copiado Exitosamente!";
                setTimeout(() => btn.innerText = original, 2000);
            });
        }

        ['dni', 'celular'].forEach(id => {
            document.getElementById(id).addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '');
            });
        });
    </script>
</body>
</html>
